name: Release
on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check
        run: |
          yarn typecheck
          yarn lint
          yarn test

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: yarn prepare

      - name: Point npm at the registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing: npm trusts this workflow through OIDC, so no token is stored anywhere.
      # The version is staged, not published: a maintainer approves it on npmjs.com (or with
      # `npm stage approve <id>`) using their own two-factor authentication before it goes live.
      - name: Install an npm that supports staged publishing
        run: npm install --global npm@^12.2.0

      - name: Stage the release on npm
        run: npm stage publish . --access public
